name: spoons-up

x-api-service: &api-service
  image: spoons-up-api:local
  pull_policy: never
  environment:
    DATABASE_URL: postgresql+psycopg://spoons:spoons@db:5432/spoons
    JWT_SECRET: ${JWT_SECRET:-local-compose-jwt-secret-change-before-production}
    ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
    REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-30}
    REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
    CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ACTIVE_USER_DAYS: ${ACTIVE_USER_DAYS:-30}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: spoons
      POSTGRES_PASSWORD: spoons
      POSTGRES_USER: spoons
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spoons -d spoons"]
      start_interval: 2s
      start_period: 30s
      interval: 5m
      timeout: 3s
      retries: 3

  migrate:
    <<: *api-service
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api-service
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=2)",
        ]
      start_interval: 2s
      start_period: 30s
      interval: 5m
      timeout: 3s
      retries: 3

  scheduler:
    image: spoons-up-api:local
    pull_policy: never
    environment:
      DATABASE_URL: postgresql+psycopg://spoons:spoons@db:5432/spoons
      ACTIVE_USER_DAYS: ${ACTIVE_USER_DAYS:-30}
    command: ["cron", "-f"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    image: spoons-up-web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      start_interval: 2s
      start_period: 30s
      interval: 5m
      timeout: 3s
      retries: 3

  test-db:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: spoons_test
      POSTGRES_PASSWORD: spoons
      POSTGRES_USER: spoons
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spoons -d spoons_test"]
      start_interval: 2s
      start_period: 30s
      interval: 5m
      timeout: 3s
      retries: 3

volumes:
  postgres_data:
