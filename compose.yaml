name: spoons-up

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: spoons
      POSTGRES_PASSWORD: spoons
      POSTGRES_USER: spoons
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spoons -d spoons"]
      interval: 5s
      timeout: 5s
      retries: 10

  test-db:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: spoons_test
      POSTGRES_PASSWORD: spoons
      POSTGRES_USER: spoons
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spoons -d spoons_test"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
